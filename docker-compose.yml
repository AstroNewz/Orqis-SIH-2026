services:
  postgres:
    image: postgres:15-alpine
    container_name: carescan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carescan_user
      POSTGRES_PASSWORD: carescan_password
      POSTGRES_DB: carescan_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carescan_user -d carescan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carescan_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://carescan_user:carescan_password@postgres:5432/carescan_db
      QUANTUM_BACKEND: aer_simulator
      QUANTUM_QUBITS: 8
      QUANTUM_SHOTS: 1024
      SECRET_KEY: change-in-prod-secure-32-byte-hex-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
